name: Build personal iPhone apps
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-builds
  cancel-in-progress: true
jobs:
  build:
    # Standard public runners are free. Never consume metered private-repository minutes.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [focus-tube, warsaw-tech-radar]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify shared logic
        run: node --test
      - name: Build unsigned IPA without Apple credentials
        run: node scripts/build-ios.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-iPhone
          path: apps/${{ matrix.app }}/build/ios/*-unsigned.ipa
          retention-days: 1
          if-no-files-found: error
