name: Focus Tube account offline simulator tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/focus-tube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run mocked account integration tests
        run: bash tests/run-ios-account-integration.sh
